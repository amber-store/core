name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: '1.31.1'
      - run: sqlc diff
        working-directory: refstore
      - run: go generate ./cmd/amber-store
      - run: go test ./...
      - run: go test -race ./packstore ./refstore ./gc
      - run: go vet ./...
